<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Arc reactor">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="35%"  stop-color="#c0d4ff"/>
      <stop offset="70%"  stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7aa2f7" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#7aa2f7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <!-- one coil segment; instanced 10x around the ring -->
    <path id="coil" d="M -19 -132 L 19 -132 L 15 -104 L -15 -104 Z" fill="#7aa2f7"/>
    <path id="tick" d="M 0 -166 L 0 -156" stroke="#bb9af7" stroke-width="2" stroke-linecap="round"/>
  </defs>

  <!-- ambient halo, breathing -->
  <circle cx="200" cy="200" r="190" fill="url(#halo)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- outer housing ring, slow clockwise -->
  <g transform="translate(200 200)" filter="url(#glow)">
    <circle r="178" fill="none" stroke="#7aa2f7" stroke-width="2" opacity="0.6"/>
    <circle r="168" fill="none" stroke="#7aa2f7" stroke-width="6" stroke-dasharray="52 12" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </circle>
    <g opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <use href="#tick"/><use href="#tick" transform="rotate(30)"/><use href="#tick" transform="rotate(60)"/>
      <use href="#tick" transform="rotate(90)"/><use href="#tick" transform="rotate(120)"/><use href="#tick" transform="rotate(150)"/>
      <use href="#tick" transform="rotate(180)"/><use href="#tick" transform="rotate(210)"/><use href="#tick" transform="rotate(240)"/>
      <use href="#tick" transform="rotate(270)"/><use href="#tick" transform="rotate(300)"/><use href="#tick" transform="rotate(330)"/>
    </g>
  </g>

  <!-- coil ring, slow counter-clockwise -->
  <g transform="translate(200 200)" filter="url(#glow)">
    <circle r="146" fill="none" stroke="#7aa2f7" stroke-width="2" opacity="0.7"/>
    <circle r="96"  fill="none" stroke="#7aa2f7" stroke-width="2" opacity="0.7"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="60s" repeatCount="indefinite"/>
      <use href="#coil"/><use href="#coil" transform="rotate(36)"/><use href="#coil" transform="rotate(72)"/>
      <use href="#coil" transform="rotate(108)"/><use href="#coil" transform="rotate(144)"/><use href="#coil" transform="rotate(180)"/>
      <use href="#coil" transform="rotate(216)"/><use href="#coil" transform="rotate(252)"/><use href="#coil" transform="rotate(288)"/>
      <use href="#coil" transform="rotate(324)"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- inner triangle frame (subtle) -->
  <g transform="translate(200 200)" opacity="0.5" filter="url(#glow)">
    <polygon points="0,-78 68,39 -68,39" fill="none" stroke="#bb9af7" stroke-width="2"/>
    <polygon points="0,-58 50,29 -50,29" fill="none" stroke="#7aa2f7" stroke-width="1.5"/>
    <animate attributeName="opacity" values="0.35;0.6;0.35" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- core -->
  <circle cx="200" cy="200" r="70" fill="#7aa2f7" opacity="0.5" filter="url(#softglow)">
    <animate attributeName="r" values="62;74;62" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="200" r="52" fill="url(#core)">
    <animate attributeName="r" values="48;56;48" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="200" r="22" fill="#ffffff">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
