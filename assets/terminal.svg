  <text x="26" y="266" font-family="Menlo, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="13" fill="#5fdf5f"><tspan fill="#ffffff" font-weight="bold">Anmol Agarwal</tspan> is a CS undergrad at JIIT Noida (batch of 2028). He builds trading</text>
  <text x="26" y="284" font-family="Menlo, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="13" fill="#5fdf5f">systems, AI agents and small embedded devices, and solves competitive-programming</text>
  <text x="26" y="302" font-family="Menlo, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="13" fill="#5fdf5f">problems when the builds are green.</text>
  <text x="26" y="326" font-family="Menlo, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="13" fill="#9a9a9a">Read <tspan fill="#ffffff" font-weight="bold">2</tspan> files, listed <tspan fill="#ffffff" font-weight="bold">1</tspan> directory, ran <tspan fill="#ffffff" font-weight="bold">0</tspan> shell commands</text>
